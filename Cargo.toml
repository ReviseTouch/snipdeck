[package]
name = "snipdeck"
version = "0.2.0"
edition = "2021"
description = "A fast screen-snipping deck for Windows and Linux: capture regions, keep floating snips on screen, OCR-index, search, and manage hundreds of screenshots."
authors = ["Hasan Salihoğlu <hsn.salihoglu@gmail.com>"]
license = "MIT"
repository = "https://github.com/hasantr/snipdeck"
homepage = "https://github.com/hasantr/snipdeck"
readme = "README.md"
keywords = ["screenshot", "snipping", "ocr", "windows", "linux"]
categories = ["multimedia::images", "gui"]

[[bin]]
name = "snipdeck"
path = "src/main.rs"

[dependencies]
# The renderer is chosen per platform, in the target sections below:
# software on Windows, femtovg (GPU) everywhere else. Slint compiles in only
# the renderers asked for, so each target asks for its own.
slint = { version = "1.8", default-features = false, features = ["std", "compat-1-2", "backend-winit", "raw-window-handle-06"] }
# Direct handle on the winit backend so we can hook real winit window events
# (Focused/Resized/Occluded) and force a fresh frame on restore — a timer-driven
# request_redraw isn't serviced until a genuine window event arrives, so the
# window otherwise wakes blank. Also gives `WinitWindowAccessor`, which is how
# `floating.rs` reaches `drag_window()` for compositor-driven moves on Wayland.
# Features unify with slint's.
i-slint-backend-winit = "1.16"
raw-window-handle = "0.6"
xcap = "0.0.14"
arboard = { version = "3", features = ["image-data"] }
global-hotkey = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
# Snips are stored as lossless WebP (see src/image_files.rs). The `image` crate
# decodes it, but its own encoder reaches only half the size libwebp does:
# measured on a real gallery of 126 screenshots, the PNGs were 10.7 MB, image's
# lossless WebP 5.4 MB, libwebp's 2.9 MB — pixel for pixel identical. libwebp is
# BSD-licensed C, built from the vendored source; default features off so it
# does not pull a second copy of `image` in.
webp = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
dirs = "5"
rfd = "0.14"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
sys-locale = "0.3"
anyhow = "1"
crossbeam-channel = "0.5"
# Tiny synchronous HTTP client (rustls TLS bundled — no OpenSSL, no async
# runtime) used by the OCR-translate feature. Runs on the same worker thread
# the OCR already uses, so no tokio/reqwest weight is pulled in.
ureq = { version = "2", features = ["json"] }
# The `{regex:…}` output syntax of imported ShareX uploaders (`src/sxcu.rs`).
# Already in the tree through other crates; no new download.
regex = "1"
# Pure-Rust 2D rasteriser (the resvg engine) used to FLATTEN annotations onto
# the snip at full resolution: proper anti-aliased thick strokes, round caps/
# joins and fills that match the live Slint `Path` preview pixel-for-pixel. No
# system/GPU deps.
tiny-skia = "0.11"
# Bake annotation text into the image on save with the text stack Slint itself
# draws the live preview with: parley lays it out (system fonts via fontique,
# fallback, shaping, bidi), skrifa reads the glyph outlines, tiny-skia fills
# them. Keep the versions on the ones slint pulls in, so nothing builds twice.
parley = "0.8"
skrifa = "0.40"

# femtovg (GPU), NOT the software renderer, and the reason is Wayland-specific:
# Slint's software path renders through softbuffer, whose Wayland backend
# allocates `wl_shm::Format::Xrgb8888` — the X means the alpha byte is dropped.
# A transparent window is therefore impossible there, and the snip overlay and
# context menu both came out as solid black rectangles over the desktop. A GPU
# renderer gets an alpha-capable surface and they composite correctly.
[target.'cfg(not(target_os = "windows"))'.dependencies]
slint = { version = "1.8", default-features = false, features = ["renderer-femtovg"] }
i-slint-backend-winit = { version = "1.16", features = ["renderer-femtovg"] }

# The global pointer hook behind Win+drag, used on Windows (as the fallback to
# the native hook) and macOS. Not on Linux: there it reads /dev/input, which
# only an `input`-group user can, and harmed more than it helped where it
# could (see mouse_trigger::start_polling).
[target.'cfg(not(target_os = "linux"))'.dependencies]
rdev = { version = "0.5", features = ["unstable_grab"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Software on Windows, which `main` installs by name: the transparent snip
# overlay composites the same on every monitor through DWM's standard path,
# where OpenGL transparency depends on the adapter (it came up opaque on the
# primary monitor and transparent on a secondary); it needs no GPU driver,
# so it starts in VMs and Remote Desktop sessions that offer only Windows'
# OpenGL 1.1; and no GL context means less memory. When femtovg was made
# global for Wayland, Windows kept asking for "software", Slint fell back to
# femtovg without a word, and all three were quietly lost.
slint = { version = "1.8", default-features = false, features = ["renderer-software"] }
i-slint-backend-winit = { version = "1.16", features = ["renderer-software"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Mapi",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "ApplicationModel_DataTransfer",
    "Storage_Streams",
] }

# Unix-only: `flock` for the single-instance guard (see single_instance.rs).
# Windows uses a named mutex there instead, so this never enters that build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux-only tray. Windows builds its tray natively on Shell_NotifyIconW (see
# tray.rs) and pulls none of this in. tray-icon needs GTK initialised and a
# GTK main loop running on the thread that owns the icon, hence the direct gtk
# dependency; at runtime it also needs libayatana-appindicator3 present.
[target.'cfg(target_os = "linux")'.dependencies]
# `default-features = false` to drop `libxdo`, keeping only `gtk`.
#
# libxdo is muda's keyboard-accelerator simulator, which this tray never uses —
# its menu is clicked, not driven by accelerators. It costs a hard link against
# libxdo.so, and its soname differs across distributions: Ubuntu ships .so.3,
# Arch .so.4. A binary built in CI therefore refused to start on Arch with
# "libxdo.so.3: cannot open shared object file", which is not a runtime
# dependency to document — it is a released artifact that does not run.
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
gtk = "0.18"
# Wayland global shortcuts (see src/portal_hotkeys.rs).
#
# 0.13, NOT the 0.8 that rfd drags in. xdg-desktop-portal returns the
# CreateSession session_handle as a string, not the object path the spec
# promised (flatpak/xdg-desktop-portal#609); 0.8's derived deserialiser only
# accepts `o` and dies with "missing field `session_handle`" against portal
# 1.22, while 0.13 hand-rolls it to take either. Cargo keeps both copies, so
# rfd is unaffected.
#
# async-io, not tokio (ashpd's default): the app has no async runtime and does
# not want one — pollster drives these few D-Bus round trips from a plain
# thread. Only the global_shortcuts feature is enabled; every other portal
# stays out of the build.
ashpd = { version = "0.13", default-features = false, features = [
    "async-io",
    "global_shortcuts",
    "screencast",
    # The colour picker: org.freedesktop.portal.Screenshot.PickColor, the
    # only way to read a pixel off a Wayland screen (see loupe.rs).
    "screenshot",
] }
# Wayland screen capture (see src/wayland_screencast.rs).
#
# xcap's Wayland path asks GNOME to write a full-screen PNG into /tmp and reads
# it back — a 3840x2400 encode, a disk round-trip and a decode for every snip,
# which measured 5-9 seconds on this machine and rings the shutter each time.
# ScreenCast hands over PipeWire buffers in memory instead.
#
# libpipewire is loaded at run time (src/pipewire_dl.rs), not linked: the
# `pipewire` crate's bindings needed SPA headers newer than Ubuntu 22.04 has,
# where the release is built. libpipewire is present wherever PipeWire is the
# audio server, which on a Wayland desktop is everywhere, and the xcap path is
# kept as the fallback regardless. Already in the tree, via wayland-sys.
libloading = "0.8"
pollster = "0.3"
# The GNOME extension's channel into the app (see src/bus_service.rs).
#
# Already in the tree — ashpd above and Slint's winit backend both pull zbus 5
# with async-io — so naming it adds no crate. async-io for the same reason
# ashpd uses it: there is no tokio runtime here.
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
ico = "0.3"

[build-dependencies]
slint-build = "1.8"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Tuned for a small binary WITHOUT sacrificing runtime performance:
#   opt-level = 3      keep full speed optimisation (the renderer and image
#                      paths stay fast); we do NOT drop to "s"/"z".
#   lto = "fat"        whole-program LTO — aggressive cross-crate inlining and
#                      dead-code elimination; smaller AND usually faster.
#   codegen-units = 1  one unit lets LTO see everything (smaller + faster).
#   strip = true       drop symbols/debuginfo from the shipped exe.
# NOTE: panic is intentionally left as "unwind" (NOT "abort"): src/ocr.rs relies
# on catch_unwind so a panic inside windows-rs OCR surfaces as an error instead
# of killing the whole app. "abort" would shave a little size but defeat that.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

name: Build & Release

# Builds Snipdeck for Windows x64 on every push to main / PR (so breakage is
# caught early), and — when a `v*` tag is pushed — also attaches the built
# .exe to a GitHub Release.
#
# Public repositories get GitHub-hosted runners for FREE with no monthly minute
# cap, so this costs nothing for an open-source project.
#
# NOTE: Linux is COMPILE-CHECKED below but deliberately NOT published. The
# platform now has real implementations (overlay-driven selection, tray via
# tray-icon, tesseract OCR, xdg-utils sharing) rather than empty stubs, so a
# build job catches breakage early — but "compiles" is still not "works".
# No Linux binary ships until the runtime paths are verified by hand on a real
# desktop session. macOS remains unbuilt: its OCR backend is still a stub.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Needed so the release step can create/update a GitHub Release.
permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --target x86_64-pc-windows-msvc
        env:
          # Optional: a donation URL baked in only if you set the repo secret.
          # Left unset, the About window simply hides the donate button — no
          # secret ends up in the source tree or the public binary by default.
          SNIPDECK_DONATE_URL: ${{ secrets.SNIPDECK_DONATE_URL }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/snipdeck.exe" "dist/snipdeck-windows-x64.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: snipdeck-windows-x64
          path: dist/snipdeck-windows-x64.exe
          if-no-files-found: error

      # Only on a version tag: attach the .exe to the GitHub Release.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/snipdeck-windows-x64.exe
          fail_on_unmatched_files: true

  # Compile check only — no artifact upload, nothing attached to a Release.
  # Its job is to catch a Windows-only change that breaks the Linux cfg paths.
  linux:
    name: Linux x64 (compile check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      # GTK: rfd dialogs + tray-icon. xcb/xrandr: xcap screen capture.
      # xkbcommon/wayland: the winit backend. appindicator: the tray host.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev \
            libayatana-appindicator3-dev

      - name: Build (release)
        run: cargo build --release

name: Build & Release

# Builds and tests Snipdeck for Windows x64 and Linux x64 on every push and PR
# (so breakage is caught early), audits the dependencies, and — when a `v*` tag
# is pushed — publishes both builds and their SHA256 checksums as a GitHub
# Release.
#
# Public repositories get GitHub-hosted runners for FREE with no monthly minute
# cap, so this costs nothing for an open-source project.
#
# Linux x64 now SHIPS. The runtime paths that "compiles is not works" was
# holding out for have since been verified by hand on a real Wayland/GNOME
# session: region capture and the freeze overlay, global shortcuts through
# xdg-desktop-portal, tesseract OCR, the tray, dragging. What Wayland does not
# permit at all — pinning a snip where it was captured, floating above other
# windows, staying out of the window list — is documented in the README rather
# than pretended away.
#
# macOS remains unbuilt: its OCR backend is still a stub.
on:
  push:
    # Feature branches too, not just main. Work here lands on a long-lived
    # `feat/*` branch and only reaches main much later, so filtering to main
    # meant the branch where the breakage actually happens was the one branch
    # never built.
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only for everything that builds, tests or audits. Only the release job,
# which runs on a version tag and builds nothing, may write.
#
# Every action is pinned to a commit, not a tag: a tag can be moved to other
# code, and these steps run with the repository's token. The comment beside
# each pin names the version it is.
permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (release)
        run: cargo build --release --target x86_64-pc-windows-msvc
        env:
          # Optional: a donation URL baked in only if you set the repo secret.
          # Left unset, the About window simply hides the donate button — no
          # secret ends up in the source tree or the public binary by default.
          SNIPDECK_DONATE_URL: ${{ secrets.SNIPDECK_DONATE_URL }}

      # The Linux job has always run these; this one never did, so a test that
      # only fails on Windows could ship.
      - name: Run tests
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/snipdeck.exe" "dist/snipdeck-windows-x64.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snipdeck-windows-x64
          path: dist/snipdeck-windows-x64.exe
          if-no-files-found: error

  linux:
    name: Linux x64
    # 22.04, deliberately, NOT ubuntu-latest. A Rust binary carries the glibc
    # version it was linked against as a hard floor: built on 24.04 it demands
    # GLIBC_2.39 and refuses to start on Ubuntu 22.04, Debian 12 or anything
    # else older, with an error that looks like a broken download. 22.04 gives
    # glibc 2.35, which every currently-supported distribution satisfies.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pin the cache to this runner image and this dependency shape.
          # Without it, moving the job from ubuntu-latest to ubuntu-22.04
          # restored proc-macro .so files linked against GLIBC_2.39 onto a 2.35
          # image and the build died loading its own cache; the same stale entry
          # also carried muda's old feature fingerprint, so it recompiled
          # against a gtk it no longer had. Bump the version when either the
          # runner or a dependency's features change.
          prefix-key: v3-ubuntu2204-nopipewire

      # GTK: rfd dialogs + tray-icon. xcb/xrandr: xcap screen capture.
      # xkbcommon/wayland: the winit backend. appindicator: the tray host.
      # No PipeWire: it is loaded at run time (src/pipewire_dl.rs), and the
      # crate that linked it needed SPA headers newer than this image has.
      # No xtst: rdev, which grabbed X11 input with it, is not built on Linux.
      # GL/EGL: the femtovg renderer. The software renderer needed neither, but
      # it cannot produce a transparent window on Wayland (softbuffer allocates
      # Xrgb8888 and drops the alpha), which turned the snip overlay and the
      # context menu into solid black rectangles.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev \
            libayatana-appindicator3-dev \
            libfontconfig-dev libdbus-1-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Build (release)
        run: cargo build --release
        env:
          SNIPDECK_DONATE_URL: ${{ secrets.SNIPDECK_DONATE_URL }}

      - name: Run tests
        run: cargo test --release

  # The released Linux build: compiled in the Debian 11 image
  # (packaging/linux/Containerfile.release) for a glibc 2.30 floor, lower than
  # this runner's 2.35, then packaged as .deb, .rpm and the tarball install.sh
  # installs from. The tarball rather than a bare binary: the desktop entry is
  # the application id the portal needs for global shortcuts, and the GNOME
  # extension and KWin script ride along, as install.sh only installs what it
  # finds beside itself.
  linux-release:
    name: Linux x64 packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: stable

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman imagemagick binutils
          cargo install --locked cargo-deb cargo-generate-rpm

      - name: Build in the Debian 11 image and package
        run: |
          packaging/linux/build-release.sh
          # Flat, so the release job finds them at the top of its download.
          mkdir -p out
          cp dist/*/snipdeck-linux-x64.tar.gz dist/*/*.deb dist/*/*.rpm out/

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snipdeck-linux-x64
          path: out/*
          if-no-files-found: error

  # Known vulnerabilities in the dependency tree. Reported, not gating: an
  # advisory against a crate that Snipdeck cannot yet move off should not stop
  # a release, but it should not go unseen either.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock
        run: cargo audit

  # On a version tag only: gather what the build jobs produced, add a SHA256
  # checksum list, and publish them as the release. The one job with write
  # access, and it compiles nothing.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, linux-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum snipdeck-windows-x64.exe snipdeck-linux-x64.tar.gz *.deb *.rpm | tee SHA256SUMS

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/snipdeck-windows-x64.exe
            dist/snipdeck-linux-x64.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          fail_on_unmatched_files: true

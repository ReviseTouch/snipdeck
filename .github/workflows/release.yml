name: Build & Release

# Builds Snipdeck for Windows x64 on every push to main / PR (so breakage is
# caught early), and — when a `v*` tag is pushed — also attaches the built
# .exe to a GitHub Release.
#
# Public repositories get GitHub-hosted runners for FREE with no monthly minute
# cap, so this costs nothing for an open-source project.
#
# NOTE: Linux/macOS are intentionally NOT built here. The code has cfg
# fallbacks for them, but "compiles" is not "works" — those platforms must be
# verified by hand on a real machine before any binary is published. Add a
# matrix back once they're actually tested.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Needed so the release step can create/update a GitHub Release.
permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --target x86_64-pc-windows-msvc
        env:
          # Optional: a donation URL baked in only if you set the repo secret.
          # Left unset, the About window simply hides the donate button — no
          # secret ends up in the source tree or the public binary by default.
          SNIPDECK_DONATE_URL: ${{ secrets.SNIPDECK_DONATE_URL }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/snipdeck.exe" "dist/snipdeck-windows-x64.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: snipdeck-windows-x64
          path: dist/snipdeck-windows-x64.exe
          if-no-files-found: error

      # Only on a version tag: attach the .exe to the GitHub Release.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/snipdeck-windows-x64.exe
          fail_on_unmatched_files: true

name: Build & Release

# Builds Snipdeck for Windows x64 on every push to main / PR (so breakage is
# caught early), and — when a `v*` tag is pushed — also attaches the built
# .exe to a GitHub Release.
#
# Public repositories get GitHub-hosted runners for FREE with no monthly minute
# cap, so this costs nothing for an open-source project.
#
# Linux x64 now SHIPS. The runtime paths that "compiles is not works" was
# holding out for have since been verified by hand on a real Wayland/GNOME
# session: region capture and the freeze overlay, global shortcuts through
# xdg-desktop-portal, tesseract OCR, the tray, dragging. What Wayland does not
# permit at all — pinning a snip where it was captured, floating above other
# windows, staying out of the window list — is documented in the README rather
# than pretended away.
#
# macOS remains unbuilt: its OCR backend is still a stub.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Needed so the release step can create/update a GitHub Release.
permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --target x86_64-pc-windows-msvc
        env:
          # Optional: a donation URL baked in only if you set the repo secret.
          # Left unset, the About window simply hides the donate button — no
          # secret ends up in the source tree or the public binary by default.
          SNIPDECK_DONATE_URL: ${{ secrets.SNIPDECK_DONATE_URL }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/snipdeck.exe" "dist/snipdeck-windows-x64.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: snipdeck-windows-x64
          path: dist/snipdeck-windows-x64.exe
          if-no-files-found: error

      # Only on a version tag: attach the .exe to the GitHub Release.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/snipdeck-windows-x64.exe
          fail_on_unmatched_files: true

  linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      # GTK: rfd dialogs + tray-icon. xcb/xrandr: xcap screen capture.
      # xkbcommon/wayland: the winit backend. appindicator: the tray host.
      # xdo/xtst: rdev's X11 input grab — the linker needs -lxdo, and leaving
      # it out is what broke the first run of this job.
      # GL/EGL: the femtovg renderer. The software renderer needed neither, but
      # it cannot produce a transparent window on Wayland (softbuffer allocates
      # Xrgb8888 and drops the alpha), which turned the snip overlay and the
      # context menu into solid black rectangles.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev \
            libayatana-appindicator3-dev \
            libxdo-dev libxtst-dev libfontconfig-dev libdbus-1-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Build (release)
        run: cargo build --release
        env:
          SNIPDECK_DONATE_URL: ${{ secrets.SNIPDECK_DONATE_URL }}

      - name: Run tests
        run: cargo test --release

      # A tarball rather than a bare binary: the .desktop entry has to be
      # installed for global shortcuts to work at all on Wayland (the portal
      # derives the application id from it), so shipping the binary alone would
      # hand people a build whose shortcuts silently do nothing.
      - name: Stage artifact
        run: |
          mkdir -p dist/snipdeck-linux-x64
          cp target/release/snipdeck dist/snipdeck-linux-x64/
          cp packaging/linux/snipdeck.desktop dist/snipdeck-linux-x64/
          cp packaging/linux/install.sh dist/snipdeck-linux-x64/
          cp assets/preview_256.png dist/snipdeck-linux-x64/snipdeck.png
          chmod +x dist/snipdeck-linux-x64/install.sh
          tar -C dist -czf dist/snipdeck-linux-x64.tar.gz snipdeck-linux-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: snipdeck-linux-x64
          path: dist/snipdeck-linux-x64.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/snipdeck-linux-x64.tar.gz
          fail_on_unmatched_files: true
